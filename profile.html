<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>My Profile · KRP</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="theme.css?v=45"><script src="theme.js?v=1"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#14213d;font-family:Arial,sans-serif}.wrap{width:min(650px,calc(100% - 20px));margin:18px auto}.top,.card{background:#fff;border:1px solid #dde4ee;border-radius:14px}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;margin-bottom:10px}.top h1{font-size:18px;margin:0}.back,.save{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.back{background:#e9edff;color:#203487}.save{background:#14834a;color:#fff;width:100%;margin-top:12px}.card{padding:16px}.photo{display:grid;justify-items:center;gap:8px;margin-bottom:15px}.photo img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #e1f5e8;background:#edf1f7}.photo label{background:#edf7f0;color:#0b7040;padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}.photo input{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:4px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #d9e1eb;border-radius:8px}.field input[readonly]{background:#f1f3f7;color:#687386}.full{grid-column:1/-1}.note{font-size:10px;color:#778297;margin-top:4px}.msg{margin-top:10px;font-size:12px;font-weight:700}.ok{color:#08753b}.err{color:#bd2d27}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap"><header class="top"><h1>My Profile</h1><button class="back" onclick="location.href='index.html'">← Dashboard</button></header><form id="form" class="card"><div class="photo"><img id="avatar" alt="Profile photo"><label>📷 Change Photo<input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><span class="note">JPG, PNG या WebP · अधिकतम 5 MB</span></div><div class="grid"><div class="field"><label>First Name</label><input id="firstName" readonly><span class="note">Sign-up identity बदली नहीं जा सकती</span></div><div class="field"><label>Last Name</label><input id="lastName" readonly><span class="note">Sign-up identity बदली नहीं जा सकती</span></div><div class="field"><label>Designation</label><input id="designation" maxlength="100"></div><div class="field"><label>Email</label><input id="email" readonly><span class="note">Email बदला नहीं जा सकता</span></div><div class="field"><label>Mobile No.</label><input id="mobile" readonly><span class="note">Mobile बदला नहीं जा सकता</span></div><div class="field full"><label>Address</label><textarea id="address" rows="2" maxlength="300"></textarea></div><div class="field full"><label>About / Bio</label><textarea id="bio" rows="3" maxlength="500"></textarea></div></div><button class="save" id="save">Save Profile</button><div id="message" class="msg"></div></form></main>
<script>
(()=>{try{const uid=sessionStorage.getItem('krp_cache_user_uid'),p=JSON.parse(sessionStorage.getItem(`krp_profile_bootstrap_${uid}`)||'null');if(!p)return;const names=(p.full_name||'').trim().split(/\s+/),set=(id,value)=>{const el=document.getElementById(id);if(el)el.value=value||''};set('firstName',p.first_name||names[0]);set('lastName',p.last_name||names.slice(1).join(' '));set('designation',p.designation);set('email',p.email);set('mobile',p.mobile_no);set('address',p.address);set('bio',p.bio);if(p.avatar_url)document.getElementById('avatar').src=p.avatar_url;document.getElementById('message').textContent='Profile ready';document.getElementById('message').className='msg ok'}catch(_){}})();
</script>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,AUTH_OPTIONS}from'./supabase-config.js?v=3';
const c=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,storage:sessionStorage,autoRefreshToken:true}}),$=id=>document.getElementById(id);let user,profile,avatarPath='';
function message(t,e=false){$('message').textContent=t;$('message').className='msg '+(e?'err':'ok')}function placeholder(n){const initials=(n||'U').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();return`data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="100%" height="100%" fill="#168447"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Arial" font-size="70" font-weight="700">${initials}</text></svg>`)}`}
async function avatar(){if(!avatarPath){$('avatar').src=placeholder(profile?.full_name);return}const{data}=await c.storage.from('krp-avatars').createSignedUrl(avatarPath,3600);$('avatar').src=data?.signedUrl||placeholder(profile?.full_name)}
async function boot(){let{data:{session}}=await c.auth.getSession();user=session?.user;if(!user){location.replace(`${AUTH_OPTIONS.loginPage}?next=profile.html`);return}let{data,error}=await c.from('app_users').select('*').eq('user_id',user.id).maybeSingle();if(error){const{data:refreshed}=await c.auth.refreshSession();session=refreshed?.session||session;user=session?.user;if(user)({data,error}=await c.from('app_users').select('*').eq('user_id',user.id).maybeSingle())}if(error){message('Session verify नहीं हुई। Page refresh करें।',true);return}const expired=data?.access_expires_at&&new Date(data.access_expires_at)<=new Date();if(!data||!data.active||data.access_status==='blocked'||data.access_status==='declined'||expired){location.replace('login.html');return}profile=data;avatarPath=data.avatar_path||'';const names=(data.full_name||'').trim().split(/\s+/);$('firstName').value=data.first_name||names[0]||'';$('lastName').value=data.last_name||names.slice(1).join(' ')||'';$('designation').value=data.designation||'';$('email').value=data.email||user.email||'';$('mobile').value=data.mobile_no||'';$('address').value=data.address||'';$('bio').value=data.bio||'';await avatar()}
$('photo').addEventListener('change',async()=>{const f=$('photo').files[0];if(!f)return;if(f.size>5242880){message('Photo 5 MB से बड़ी है',true);return}const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${user.id}/avatar-${Date.now()}.${ext}`;$('save').disabled=true;message('Photo upload हो रही है...');const{error}=await c.storage.from('krp-avatars').upload(path,f,{upsert:false,contentType:f.type});$('save').disabled=false;if(error){message(error.message,true);return}if(avatarPath)await c.storage.from('krp-avatars').remove([avatarPath]);avatarPath=path;await avatar();message('Photo ready · Save Profile दबाएँ')});
$('form').addEventListener('submit',async e=>{e.preventDefault();$('save').disabled=true;const{error}=await c.rpc('update_my_profile',{new_full_name:profile.full_name||'',new_designation:$('designation').value.trim(),new_address:$('address').value.trim(),new_bio:$('bio').value.trim(),new_avatar_path:avatarPath});$('save').disabled=false;if(error){message(error.message,true);return}message('Profile updated successfully')});boot();
</script></body></html>
