<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05a66f"><title>Sign in · KRP Dashboard</title><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="theme.css?v=32"><script src="theme.js?v=1"></script><style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#eee7da,#faf7f0 48%,#e7efe8);color:#26364a;font-family:"Segoe UI",Arial,sans-serif}.card{width:min(100%,460px);padding:30px;background:linear-gradient(145deg,#fffdf8,#efeadd);border:1px solid #fff;border-radius:24px;box-shadow:20px 22px 45px #5448342b;text-align:center}.logo{width:72px;height:72px;border-radius:19px}h1{margin:12px 0 5px;font-size:25px}p{margin:0 0 18px;color:#687788;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;margin-bottom:16px;border-radius:12px;background:#e8e5dd}.tab{min-height:40px;border:0;border-radius:9px;background:transparent;color:#687386;font-weight:800;cursor:pointer}.tab.active{background:#fff;color:#087748;box-shadow:0 3px 10px #2a323c1a}.panel{display:none;text-align:left}.panel.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:5px;font-size:11px;font-weight:800}.field input{width:100%;height:44px;padding:0 12px;border:1px solid #d6dce5;border-radius:10px;background:#fff;color:#26364a;font-size:14px}.field input:focus{outline:3px solid #05a66f21;border-color:#05a66f}.primary,.google-btn{width:100%;min-height:47px;border:0;border-radius:11px;font-weight:800;cursor:pointer}.primary{background:#128251;color:#fff}.google-btn{margin-top:10px;border:1px solid #d6dce5;background:#fff;color:#344256}.primary:disabled,.google-btn:disabled{opacity:.6;cursor:wait}.divider{display:flex;align-items:center;gap:10px;margin:12px 0 0;color:#8993a3;font-size:10px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#dfe3e8}.hint{margin:-4px 0 10px;color:#788494;font-size:10px;line-height:1.4}.message{min-height:20px;margin-top:13px;color:#bd392f;font-size:12px;line-height:1.45}.message.ok{color:#087748}.security{margin-top:14px;padding-top:12px;border-top:1px solid #dde2e7;color:#758078;font-size:10px}.honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}@media(max-width:520px){body{padding:12px}.card{padding:24px 17px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}html.krp-dark-theme body{background:linear-gradient(145deg,#06111a,#0c1e2a 52%,#081722)!important}html.krp-dark-theme .card{background:linear-gradient(145deg,#112734,#071722);color:#d1dce4;border-color:#243b49;box-shadow:20px 22px 45px #0006}html.krp-dark-theme p,html.krp-dark-theme .hint{color:#8fa1b1}html.krp-dark-theme .tabs{background:#0a1b27}html.krp-dark-theme .tab.active{background:#163142;color:#88d2aa}html.krp-dark-theme .field input{background:#0b1e2a;border-color:#29404e;color:#d3dde4;color-scheme:dark}html.krp-dark-theme .google-btn{background:#102734;border-color:#29404e;color:#c7d3dc}
</style></head><body><main class="card"><img class="logo" src="icon-192.png" alt="KRP logo"><h1>KRP Dashboard</h1><p>Secure account access</p><div class="tabs"><button class="tab active" id="signinTab" type="button">Sign In</button><button class="tab" id="signupTab" type="button">Sign Up</button></div>
<form id="signinPanel" class="panel active"><div class="field"><label>Email ID</label><input id="signinEmail" type="email" maxlength="254" autocomplete="username" required></div><div class="field"><label>Password</label><input id="signinPassword" type="password" minlength="8" maxlength="72" autocomplete="current-password" required></div><button class="primary" id="signinButton">Sign In</button><div class="divider">OR</div><button class="google-btn" id="googleLogin" type="button">G&nbsp;&nbsp; Continue with Google</button></form>
<form id="signupPanel" class="panel"><div class="grid"><div class="field"><label>First Name</label><input id="firstName" maxlength="60" autocomplete="given-name" required></div><div class="field"><label>Last Name</label><input id="lastName" maxlength="60" autocomplete="family-name" required></div><div class="field full"><label>Mobile No.</label><input id="signupMobile" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" autocomplete="tel-national" required></div><div class="field full"><label>Email ID</label><input id="signupEmail" type="email" maxlength="254" autocomplete="email" required></div><div class="field full"><label>Password</label><input id="signupPassword" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div><div class="field full"><label>Confirm Password</label><input id="confirmPassword" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div></div><input class="honeypot" id="website" tabindex="-1" autocomplete="off"><div class="hint">कम से कम 12 characters; uppercase, lowercase, number और special character जरूरी है। Email verification और admin approval के बाद access मिलेगा।</div><button class="primary" id="signupButton">Create Account</button></form><div id="message" class="message" role="alert" aria-live="polite"></div><div class="security">Protected by Supabase Auth, email verification, admin approval and Row Level Security</div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,AUTH_OPTIONS}from'./supabase-config.js';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),requested=q.get('next')||AUTH_OPTIONS.homePage,nextPage=/^[a-zA-Z0-9._-]+\.html$/.test(requested)?requested:AUTH_OPTIONS.homePage,configured=/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL)&&SUPABASE_PUBLISHABLE_KEY&&!SUPABASE_PUBLISHABLE_KEY.includes('YOUR_'),client=configured?createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,storage:sessionStorage,autoRefreshToken:true,detectSessionInUrl:true}}):null;let signedInUser=null;const msg=(t,ok=false)=>{$('message').textContent=t;$('message').className='message'+(ok?' ok':'')},time=v=>v?new Intl.DateTimeFormat('en-IN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'';
function show(name){const s=name==='signin';$('signinPanel').classList.toggle('active',s);$('signupPanel').classList.toggle('active',!s);$('signinTab').classList.toggle('active',s);$('signupTab').classList.toggle('active',!s);msg('')}$('signinTab').onclick=()=>show('signin');$('signupTab').onclick=()=>show('signup');
async function requestAccess(){const{data,error}=await client.rpc('submit_access_request',{requested_expiry:null});if(error){msg(/blocked/i.test(error.message)?'यह account admin द्वारा BLOCK किया गया है।':'Access request submit नहीं हुई।');return false}const r=Array.isArray(data)?data[0]:data;msg(`Request भेज दी गई है · ${time(r?.requested_at||new Date())}. Admin approval का इंतजार करें।`,true);return false}
async function checkAccess(){const{data:{session}}=await client.auth.getSession(),user=session?.user;if(!user)return false;signedInUser=user;const{data:a}=await client.from('app_users').select('*').eq('user_id',user.id).maybeSingle(),expired=a?.access_expires_at&&new Date(a.access_expires_at)<=new Date();if(a?.active&&a.access_status!=='blocked'&&a.access_status!=='declined'&&!expired){location.replace(nextPage);return true}const{data:r}=await client.from('access_requests').select('*').eq('user_id',user.id).maybeSingle();if(a?.access_status==='blocked'||r?.status==='blocked'){msg('यह account admin द्वारा BLOCK किया गया है।');return false}if(r?.status==='pending'){msg(`Request pending है · ${time(r.requested_at)}. Admin approval का इंतजार करें।`,true);return false}return requestAccess()}
if(!configured){msg('Supabase configuration पूरी नहीं है।');document.querySelectorAll('button').forEach(b=>b.disabled=true)}else{await checkAccess();$('signinPanel').onsubmit=async e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;const b=$('signinButton');b.disabled=true;msg('Sign in हो रहा है...');const{error}=await client.auth.signInWithPassword({email:$('signinEmail').value.trim().toLowerCase(),password:$('signinPassword').value});if(error){msg('Email या password सही नहीं है, या email verify नहीं हुई है।');b.disabled=false;return}await checkAccess();b.disabled=false};
$('signupPanel').onsubmit=async e=>{e.preventDefault();if(!e.currentTarget.reportValidity()||$('website').value)return;const first=$('firstName').value.trim(),last=$('lastName').value.trim(),mobile=$('signupMobile').value.replace(/\D/g,''),email=$('signupEmail').value.trim().toLowerCase(),password=$('signupPassword').value;if(!/^[\p{L}][\p{L} .'-]{0,59}$/u.test(first)||!/^[\p{L}][\p{L} .'-]{0,59}$/u.test(last)){msg('First और last name valid भरें।');return}if(!/^[6-9]\d{9}$/.test(mobile)){msg('Valid 10-digit Indian mobile number भरें।');return}if(password!==$('confirmPassword').value){msg('दोनों passwords match नहीं हैं।');return}if(password.length<12||!/[a-z]/.test(password)||!/[A-Z]/.test(password)||!/\d/.test(password)||!/[\W_]/.test(password)){msg('Password security requirements पूरी नहीं करता।');return}const b=$('signupButton');b.disabled=true;msg('Secure account बनाया जा रहा है...');const redirectTo=new URL(`login.html?next=${encodeURIComponent(nextPage)}`,location.href).href,{data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:redirectTo,data:{first_name:first,last_name:last,full_name:`${first} ${last}`,mobile_no:mobile}}});if(error){msg('Account create नहीं हुआ। Details check करें या कुछ देर बाद retry करें।');b.disabled=false;return}e.currentTarget.reset();msg(data.session?'Account बना है। Access request भेजी जा रही है...':'Verification link email पर भेजा गया है। Verify करके Sign In करें।',true);if(data.session)await checkAccess();b.disabled=false};
$('googleLogin').onclick=async()=>{const redirectTo=new URL(`login.html?next=${encodeURIComponent(nextPage)}`,location.href).href;msg('Google login खुल रहा है...');const{error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo,queryParams:{prompt:'select_account'}}});if(error)msg('Google login failed. Retry करें।')}}
</script></body></html>
