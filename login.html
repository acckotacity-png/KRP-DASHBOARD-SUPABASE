  <style id="login-3d-ui">
    body{position:relative;isolation:isolate;overflow-x:hidden!important;overflow-y:auto!important;perspective:1100px;background:linear-gradient(145deg,#eee7da 0%,#faf7f0 48%,#e7efe8 100%)!important}
    body::before,body::after{content:"";position:fixed;z-index:-2;border-radius:50%;pointer-events:none}
    body::before{width:44vw;height:44vw;min-width:300px;min-height:300px;left:-14vw;top:-18vw;background:radial-gradient(circle at 65% 65%,rgba(25,164,104,.20),rgba(25,164,104,0) 67%)}
    body::after{width:46vw;height:46vw;min-width:320px;min-height:320px;right:-17vw;bottom:-22vw;background:radial-gradient(circle at 35% 35%,rgba(48,105,194,.16),rgba(48,105,194,0) 68%)}
    .card{position:relative;isolation:isolate;width:min(100%,420px)!important;padding:38px 34px 30px!important;border:1px solid rgba(255,255,255,.78)!important;border-radius:25px!important;background:linear-gradient(145deg,rgba(255,253,248,.96),rgba(239,234,223,.94))!important;box-shadow:22px 24px 45px rgba(84,72,52,.18),-14px -14px 35px rgba(255,255,255,.88),inset 1px 1px 0 rgba(255,255,255,.95),inset -1px -1px 0 rgba(132,116,89,.08)!important;transform:rotateX(1.2deg) translateZ(0);overflow:visible}
    .card::before{content:"";position:absolute;z-index:-1;left:8%;right:8%;bottom:-16px;height:26px;border-radius:50%;background:rgba(63,54,42,.20);filter:blur(16px)}
    .card::after{content:"";position:absolute;left:18px;right:18px;top:16px;height:45%;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.52),rgba(255,255,255,0));pointer-events:none;z-index:-1}
    .logo{display:block;width:82px!important;height:82px!important;margin:0 auto 22px!important;padding:7px;border-radius:22px!important;background:linear-gradient(145deg,#fffdf7,#e8e2d6);box-shadow:10px 11px 20px rgba(67,58,44,.18),-8px -8px 18px rgba(255,255,255,.95),inset 1px 1px 0 rgba(255,255,255,.95);transform:translateY(-2px)}
    h1{margin:0 0 9px!important;color:#26364a!important;font-size:27px!important;letter-spacing:-.025em;text-shadow:0 1px 0 rgba(255,255,255,.9)}
    p{max-width:330px;margin:0 auto 25px!important;color:#687788!important;font-size:13.5px!important;line-height:1.58!important}
    #googleLogin{position:relative;min-height:52px!important;border:1px solid rgba(78,98,119,.13)!important;border-radius:14px!important;background:linear-gradient(145deg,#fff,#ece8df)!important;color:#28394d!important;box-shadow:7px 8px 15px rgba(75,65,49,.14),-5px -5px 13px rgba(255,255,255,.9),inset 1px 1px 0 rgba(255,255,255,.92)!important;transition:transform .16s ease,box-shadow .16s ease,color .16s ease!important}
    #googleLogin:hover{background:linear-gradient(145deg,#fbfffc,#e5f3eb)!important;border-color:rgba(14,145,88,.24)!important;color:#176f4c!important;transform:translateY(-2px);box-shadow:9px 11px 19px rgba(55,91,68,.16),-5px -5px 13px rgba(255,255,255,.92)!important}
    #googleLogin:active{transform:translateY(1px)!important;box-shadow:inset 4px 4px 9px rgba(77,68,54,.13),inset -4px -4px 9px rgba(255,255,255,.78)!important}
    #googleLogin:focus-visible{outline:3px solid rgba(36,164,109,.18);outline-offset:3px}
    .google{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#fff;color:#4285f4!important;font-size:17px!important;box-shadow:2px 3px 7px rgba(39,55,78,.13)}
    #message{margin-top:17px!important;padding:0 6px;color:#c04a3b!important;font-size:12px!important}
    .security{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-top:18px!important;padding:10px 13px 0!important;border-top:1px solid rgba(104,119,136,.13)!important;color:#7b887f!important;font-size:10px!important;letter-spacing:.02em}
    .security::before{content:"✓";display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#dcefe4;color:#168557;font-weight:900;box-shadow:inset 1px 1px 2px rgba(255,255,255,.8)}
    html.krp-dark-theme body{background:linear-gradient(145deg,#06111a 0%,#0c1e2a 52%,#081722 100%)!important}
    html.krp-dark-theme body::before{background:radial-gradient(circle at 65% 65%,rgba(20,153,99,.19),rgba(20,153,99,0) 67%)}html.krp-dark-theme body::after{background:radial-gradient(circle at 35% 35%,rgba(49,104,181,.17),rgba(49,104,181,0) 68%)}
    html.krp-dark-theme .card{background:linear-gradient(145deg,rgba(17,39,52,.98),rgba(7,23,34,.98))!important;border-color:rgba(137,160,178,.08)!important;box-shadow:22px 25px 48px rgba(0,0,0,.42),-9px -9px 25px rgba(46,72,88,.055),inset 1px 1px 0 rgba(255,255,255,.025),inset -1px -1px 0 rgba(0,0,0,.3)!important}
    html.krp-dark-theme .card::after{background:linear-gradient(135deg,rgba(101,141,163,.055),rgba(101,141,163,0))}html.krp-dark-theme .card::before{background:rgba(0,0,0,.48)}
    html.krp-dark-theme .logo{background:linear-gradient(145deg,#122c3a,#091a26);box-shadow:9px 10px 20px rgba(0,0,0,.34),-5px -5px 15px rgba(60,91,108,.07),inset 1px 1px 0 rgba(255,255,255,.035)}
    html.krp-dark-theme h1{color:#d1dce4!important;text-shadow:none}html.krp-dark-theme p{color:#8fa1b1!important}
    html.krp-dark-theme #googleLogin{background:linear-gradient(145deg,#122a37,#0a1b27)!important;color:#c8d4dd!important;border-color:rgba(137,160,178,.09)!important;box-shadow:7px 8px 16px rgba(0,0,0,.30),-4px -4px 12px rgba(67,97,114,.045),inset 1px 1px 0 rgba(255,255,255,.025)!important}
    html.krp-dark-theme #googleLogin:hover{background:linear-gradient(145deg,#14352f,#0b2427)!important;color:#91d0ae!important;border-color:rgba(62,177,119,.20)!important;box-shadow:8px 10px 18px rgba(0,0,0,.32)!important}html.krp-dark-theme #googleLogin:active{box-shadow:inset 4px 4px 9px rgba(0,0,0,.34),inset -3px -3px 8px rgba(70,101,117,.055)!important}
    html.krp-dark-theme .google{background:#162b39;box-shadow:2px 3px 7px rgba(0,0,0,.3)}html.krp-dark-theme .security{color:#7f918e!important;border-top-color:rgba(137,160,178,.08)!important}html.krp-dark-theme .security::before{background:#12392b;color:#78c99f;box-shadow:none}
    @media(max-width:520px){body{padding:14px!important}.card{width:100%!important;padding:30px 20px 24px!important;border-radius:21px!important;transform:none}.logo{width:72px!important;height:72px!important;margin-bottom:18px!important;border-radius:19px!important}h1{font-size:23px!important}p{font-size:12.5px!important;margin-bottom:21px!important}#googleLogin{min-height:49px!important;font-size:13.5px!important}.card::before{bottom:-11px;height:19px}}
    @media(prefers-reduced-motion:reduce){#googleLogin{transition:none!important}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="icon-192.png" alt="KRP logo">
    <h1>KRP Dashboard</h1>
    <p>Dashboard access करने के लिए अपने authorized Google account से sign in करें।</p>
    <button type="button" id="googleLogin"><span class="google">G</span> Continue with Google</button>
    <div id="message" role="alert"></div>
    <div class="security">Protected by Supabase Auth and Row Level Security</div>
  </main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, AUTH_OPTIONS } from "./supabase-config.js";

    const button = document.getElementById("googleLogin");
    const message = document.getElementById("message");
    const query = new URLSearchParams(location.search);
    const requestedNext = query.get("next") || AUTH_OPTIONS.homePage;
    const nextPage = /^[a-zA-Z0-9._-]+\.html$/.test(requestedNext) ? requestedNext : AUTH_OPTIONS.homePage;
    const configured = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL)
      && SUPABASE_PUBLISHABLE_KEY && !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_");

    if (!configured) {
      message.textContent = "पहले supabase-config.js में Project URL और Publishable Key डालें।";
      button.disabled = true;
    } else {
      const client = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, storage: window.sessionStorage, autoRefreshToken: true, detectSessionInUrl: true }
      });

      let signedInUser = null;
      const formatTime = value => value ? new Intl.DateTimeFormat('en-IN', { dateStyle:'medium', timeStyle:'short' }).format(new Date(value)) : '';

      async function sendAccessRequest() {
        button.disabled = true;
        message.textContent = "Access request भेजी जा रही है...";
        const { data, error } = await client.rpc('submit_access_request', { requested_expiry: null });
        if (error) {
          message.textContent = /blocked/i.test(error.message) ? "यह account admin द्वारा BLOCK किया गया है।" : error.message;
          button.disabled = /blocked/i.test(error.message);
          return false;
        }
        const request = Array.isArray(data) ? data[0] : data;
        message.textContent = `Request भेज दी गई है · ${formatTime(request?.requested_at || new Date())}. Admin approval के बाद login करें।`;
        button.textContent = "Request Pending";
        button.disabled = true;
        return false;
      }

      async function checkAccessAndContinue() {
        const { data: sessionData } = await client.auth.getSession();
        const user = sessionData?.session?.user;
        if (!user) return false;
        signedInUser = user;
        const { data: access } = await client.from("app_users").select("*").eq("user_id", user.id).maybeSingle();
        const expired = access?.access_expires_at && new Date(access.access_expires_at) <= new Date();
        const allowed = access?.active && access?.access_status !== 'blocked' && access?.access_status !== 'declined' && !expired;
        if (!allowed) {
          const { data: request } = await client.from('access_requests').select('*').eq('user_id', user.id).maybeSingle();
          if (access?.access_status === 'blocked' || request?.status === 'blocked') {
            message.textContent = "यह account admin द्वारा BLOCK किया गया है।";
            button.disabled = true;
            return false;
          }
          if (request?.status === 'pending') {
            message.textContent = `Request pending है · ${formatTime(request.requested_at)}. Admin approval का इंतजार करें।`;
            button.textContent = "Request Pending";
            button.disabled = true;
            return false;
          }
          if (request?.status === 'declined') {
            message.textContent = `Request declined है${request.admin_note ? ` · ${request.admin_note}` : ''}. आप दोबारा request भेज सकते हैं।`;
            button.textContent = "Send Request Again";
            button.dataset.requestOnly = '1';
            button.disabled = false;
            return false;
          }
          return sendAccessRequest();
        }
        const error = null;
        if (error || !access?.active) {
          await client.auth.signOut();
          message.textContent = "इस Google account को dashboard access नहीं दिया गया है।";
          button.disabled = false;
          return false;
        }
        location.replace(nextPage);
        return true;
      }

      if (query.get("error") === "access_denied") message.textContent = "इस account को access नहीं दिया गया है।";
      if (query.get("error") === "blocked") message.textContent = "यह account admin द्वारा BLOCK किया गया है।";
      if (query.get("error") === "expired") message.textContent = "आपका access expire हो गया है। दोबारा login करके नई request भेजें।";
      await checkAccessAndContinue();

      button.addEventListener("click", async () => {
        if (button.dataset.requestOnly === '1' && signedInUser) {
          await sendAccessRequest();
          return;
        }
        button.disabled = true;
        message.textContent = "Google login खुल रहा है...";
        const redirectTo = new URL(`login.html?next=${encodeURIComponent(nextPage)}`, location.href).href;
        const { error } = await client.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo, queryParams: { prompt: "select_account" } }
        });
        if (error) {
          message.textContent = error.message || "Google login failed.";
          button.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
