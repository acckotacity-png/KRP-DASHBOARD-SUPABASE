    .ledger-dialog th, .ledger-dialog td { display: table-cell !important; height: 27px !important; padding: 4px 6px !important; border: 0 !important; border-right: 1px solid #d5dfda !important; border-bottom: 1px solid #d5dfda !important; color: #263d34 !important; text-align: left !important; white-space: nowrap !important; vertical-align: middle !important; }
    .ledger-dialog th { position: sticky !important; top: 0 !important; z-index: 3 !important; height: 29px !important; background: #dfe9e3 !important; color: #29463a !important; font-size: 7px !important; text-transform: uppercase !important; letter-spacing: .15px !important; }
    .ledger-dialog tbody tr:nth-child(even) td { background: #edf3ef !important; }
    .ledger-dialog tbody tr:nth-child(odd) td { background: #f8faf9 !important; }
    .ledger-dialog td::before { content: none !important; display: none !important; }
    .ledger-dialog td .actions { display: flex !important; justify-content: flex-start !important; gap: 3px !important; }
    .ledger-dialog td .actions button { width: 24px !important; height: 22px !important; min-height: 22px !important; padding: 0 !important; border-radius: 5px !important; font-size: 8px !important; }
    html.krp-dark-theme .ledger-dialog .table-wrap { background: #091925 !important; border-color: #315064 !important; }
    html.krp-dark-theme .ledger-dialog .dialog-head h2 { color: #d2dde4 !important; }
    html.krp-dark-theme .ledger-kpis .card strong { color: #cbd6dd !important; }
    html.krp-dark-theme .ledger-kpis .card span { color: #8198a9 !important; }
    html.krp-dark-theme .ledger-dialog th { background: #183245 !important; color: #aebfca !important; border-color: #345166 !important; }
    html.krp-dark-theme .ledger-dialog td, html.krp-dark-theme .ledger-dialog td b { color: #c3d0d9 !important; border-color: #263f52 !important; }
    html.krp-dark-theme .ledger-dialog tbody tr:nth-child(odd) td { background: #0d202d !important; }
    html.krp-dark-theme .ledger-dialog tbody tr:nth-child(even) td { background: #122838 !important; }
    @media(max-width:700px){.ledger-kpis{grid-template-columns:repeat(3,minmax(90px,1fr))!important}.ledger-dialog{padding:7px!important}.ledger-dialog .table-wrap{max-height:60vh!important}.ledger-dialog table{min-width:1050px!important}}
    @media(max-width:600px){
      .modal{align-items:flex-start!important;padding:6px!important;overflow:hidden!important}
      #entryModal .dialog,#customerModal .dialog{width:100%!important;max-height:calc(100dvh - 12px)!important;padding:10px 10px 0!important;border-radius:11px!important;overflow-y:auto!important;overscroll-behavior:contain!important}
      #entryModal form,#customerModal form{padding-bottom:0!important}
      #entryModal .form-actions,#customerModal .form-actions{position:sticky!important;z-index:8!important;bottom:0!important;display:grid!important;grid-template-columns:.8fr 1.2fr!important;gap:7px!important;margin:10px -10px 0!important;padding:8px 10px calc(8px + env(safe-area-inset-bottom))!important;background:#f3f7f4!important;border-top:1px solid #c8d8d0!important;box-shadow:0 -7px 16px rgba(32,55,45,.10)!important}
      #entryModal .form-actions button,#customerModal .form-actions button{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-height:40px!important;margin:0!important;padding:7px 9px!important;font-size:11px!important;border-radius:8px!important}
      #entryModal #saveButton,#customerModal #customerSaveButton{background:linear-gradient(145deg,#07975f,#06ae70)!important;color:#fff!important;border:1px solid #21c485!important;box-shadow:0 4px 10px rgba(5,142,89,.22)!important}
      html.krp-dark-theme #entryModal .form-actions,html.krp-dark-theme #customerModal .form-actions{background:#102e29!important;border-color:#2d594f!important;box-shadow:0 -8px 18px rgba(0,0,0,.30)!important}
      html.krp-dark-theme #entryModal .form-actions .outline,html.krp-dark-theme #customerModal .form-actions .outline{background:#183b35!important;color:#bdcec7!important;border-color:#3a6259!important}
      .ledger-dialog{max-height:calc(100dvh - 12px)!important;overflow-y:auto!important}
      .ledger-kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      .ledger-command-row{flex-wrap:nowrap!important;overflow-x:auto!important;padding-bottom:4px!important;scrollbar-width:thin!important}
      .ledger-command-row button{flex:0 0 auto!important;white-space:nowrap!important}
    }
  </style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1><i class="fas fa-book-open"></i>Udhari Bahi Khata</h1>
    <div class="top-actions">
      <button class="outline icon-only" onclick="loadData(true)" title="Refresh" aria-label="Refresh"><i class="fas fa-rotate"></i></button>
      <button class="success icon-only" data-right="create" onclick="openNewCustomerForm()" title="New Customer" aria-label="New Customer"><i class="fas fa-user-plus"></i></button>
      <button class="primary icon-only" data-right="create" onclick="openForm()" title="New Ledger Entry" aria-label="New Ledger Entry"><i class="fas fa-file-circle-plus"></i></button>
    </div>
  </div>

  <section class="cards">
    <div class="card"><span>Customers</span><strong id="customerCount">0</strong></div>
    <div class="card"><span>Total Udhari</span><strong id="totalUdhari">₹0</strong></div>
    <div class="card"><span>Payment Mila</span><strong id="totalPayment">₹0</strong></div>
    <div class="card"><span>Current Balance</span><strong id="totalBalance">₹0</strong></div>
    <div class="card"><span>Remaining Interest</span><strong id="totalInterest">₹0</strong></div>
    <div class="card"><span>Total Payable</span><strong id="totalPayable">₹0</strong></div>
  </section>

  <div class="tools">
    <div class="search">
      <i class="fas fa-search"></i>
      <input id="searchInput" placeholder="Customer name ya mobile number search karein..." oninput="handleSearch(this.value)">
      <button id="clearSearch" class="clear" onclick="clearSearch()" title="Clear"><i class="fas fa-times"></i></button>
    </div>
    <span id="recordCount">0 customers</span>
    <span id="statusMessage" class="status">Ready</span>
  </div>

  <div id="customerCards" class="customer-grid"></div>
  <div id="moreWrap" class="more"><button id="moreButton" class="outline" onclick="toggleMore()">Show 10 More</button></div>
</main>

<div class="modal" id="ledgerModal" hidden>
  <div class="dialog ledger-dialog">
    <div class="dialog-head"><h2 id="ledgerTitle">Customer Ledger</h2><button class="close" onclick="closeLedger()">&times;</button></div>
    <div id="ledgerSummary" class="ledger-summary"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Type</th><th>Description</th><th>Udhari</th><th>Payment</th><th>Balance</th>
          <th>Interest</th><th>Total Payable</th><th>Due Date</th><th>Status</th><th>Mode</th>
          <th>Reference</th><th>Remarks</th><th>Actions</th>
        </tr></thead>
        <tbody id="ledgerRows"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal" id="customerModal">
  <div class="dialog" style="width:min(560px,100%)">
    <div class="dialog-head"><h2><i class="fas fa-user-plus"></i> Add New Customer</h2><button class="close" onclick="closeCustomerForm()">&times;</button></div>
    <form id="customerForm" onsubmit="saveNewCustomer(event)">
      <div class="grid" style="grid-template-columns:1fr">
        <div class="field"><label>Mobile No. *</label><input id="newCustomerMobile" inputmode="numeric" maxlength="15" required></div>
        <div class="field"><label>Customer Name *</label><input id="newCustomerName" required></div>
        <div class="field"><label>Address / State</label><textarea id="newCustomerAddress"></textarea></div>
      </div>
      <div class="form-actions"><button type="button" class="outline" onclick="closeCustomerForm()">Cancel</button><button id="customerSaveButton" class="success" type="submit">Add Customer</button></div>
    </form>
  </div>
</div>

<div class="modal" id="entryModal">
  <div class="dialog">
    <div class="dialog-head"><h2 id="formTitle">Add Udhari Entry</h2><button class="close" onclick="closeForm()">&times;</button></div>
    <form id="entryForm" onsubmit="saveEntry(event)">
      <input type="hidden" id="entryId">
      <div class="grid">
        <div class="field"><label>Date *</label><input type="date" id="date" onchange="syncInterestDate()" required></div>
        <div class="field"><label>Mobile No. *</label><input id="mobileNo" inputmode="numeric" maxlength="15" oninput="lookupCustomer()" required><small id="customerLookup" class="status"></small></div>
        <div class="field"><label>Customer Name *</label><input id="customerName" required></div>
        <div class="field"><label>Address / State</label><input id="address"></div>
        <div class="field"><label>Transaction Type</label><select id="transactionType" onchange="applyType()"><option>UDHAR DIYA</option><option>UDHAR LIYA</option><option>PAYMENT MILA</option></select></div>
        <div class="field"><label>Description</label><input id="description"></div>
        <div class="field credit-only"><label id="udharAmountLabel">Udhari Diya Amount</label><input type="number" step="0.01" id="udharAmount"></div>
        <div class="field payment-only" hidden><label>Payment Mila Amount</label><input type="number" step="0.01" id="paymentAmount"></div>
        <div class="field credit-only"><label>Due Date</label><input type="date" id="dueDate"></div>
        <div class="field payment-only" hidden><label>Payment Mode</label><select id="paymentMode"><option value="">Select</option><option>CASH</option><option>UPI</option><option>BANK</option><option>OTHER</option></select></div>
        <div class="field payment-only" hidden><label>UTR / Reference No.</label><input id="referenceNo"></div>
        <div class="field credit-only"><label>Reminder Date</label><input type="date" id="reminderDate"></div>
        <div class="field credit-only"><label>Interest Rate (%)</label><input type="number" step="0.01" id="interestRate" value="0"></div>
        <div class="field credit-only"><label>Interest Type</label><select id="interestType"><option>MONTHLY</option><option>YEARLY</option></select></div>
        <div class="field credit-only"><label>Interest Start Date</label><input type="date" id="interestStartDate"></div>
        <div class="field wide"><label>Remarks</label><textarea id="remarks"></textarea></div>
      </div>
      <div class="form-actions"><button type="button" class="outline" onclick="closeForm()">Cancel</button><button id="saveButton" class="success" type="submit">Save Entry</button></div>
    </form>
  </div>
</div>

<script>
  const API_URL = new URLSearchParams(location.search).get('api') || '';
  const CACHE_KEY = 'krp_udhari_cache_v1_' + (sessionStorage.getItem('krp_cache_user_uid') || 'signed_out');
  const COL = { id:0,date:1,name:2,mobile:3,address:4,type:5,description:6,udhar:7,payment:8,balance:9,due:10,mode:11,ref:12,status:13,reminder:14,remarks:15,createdBy:16,timestamp:17,rate:18,interestType:19,interestStart:20,interestTill:21,interest:22,total:23 };
  let records = [];
  let customersMaster = [];
  let query = '';
  let visible = 10;
  let filteredCount = 0;
  let activeLedgerKey = '';
  let returnToLedgerKey = '';

  function currentAccess() {
    let user=null;
    try { user=window.parent.currentKrpUser||window.currentKrpUser||null; } catch (_) { user=window.currentKrpUser||null; }
    const permissions=user?.permissions||{};
    const admin=user?.role==='admin';
    return {create:admin||permissions.create===true,edit:admin||permissions.edit===true,delete:admin||permissions.delete===true};
  }
  function hasRight(right) { return currentAccess()[right]===true; }
  function applyPermissionVisibility() {
    const access=currentAccess();
    document.body.classList.toggle('no-create',!access.create);
    document.body.classList.toggle('no-edit',!access.edit);
    document.body.classList.toggle('no-delete',!access.delete);
  }
  function requireRight(right) {
    if(hasRight(right))return true;
    alert(`${right.toUpperCase()} right aapko provide nahi kiya gaya hai.`);
    return false;
  }

  const money = value => '₹' + (Number(String(value || 0).replace(/,/g,'')) || 0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const num = value => Number(String(value || 0).replace(/,/g,'')) || 0;
  const escapeHtml = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isoToDisplay = value => { const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?`${m[3]}-${m[2]}-${m[1]}`:value||''; };
  const displayToIso = value => { const m=String(value||'').match(/^(\d{2})-(\d{2})-(\d{4})$/); return m?`${m[3]}-${m[2]}-${m[1]}`:value||''; };
  const dateTime = value => { const iso=displayToIso(value); const t=new Date(iso+'T00:00:00').getTime(); return Number.isFinite(t)?t:0; };
  const localTodayIso = () => { const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

  function setStatus(text, error=false) { const el=document.getElementById('statusMessage'); el.textContent=text; el.style.color=error?'#c62828':'#008f68'; }
  function cache() { localStorage.setItem(CACHE_KEY, JSON.stringify({savedAt:Date.now(),records,customersMaster})); }
  function restoreCache() { try { const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); if(c?.records){records=c.records;customersMaster=Array.isArray(c.customersMaster)?c.customersMaster:[];render();return true;} } catch(e){} return false; }
  function applyServerData(result, message='Updated') {
    if(Array.isArray(result?.data)) {
      records=result.data;
      customersMaster=Array.isArray(result.customers)?result.customers:customersMaster;
      cache();
      render();
      setStatus(message);
      return true;
    }
    return false;
  }

  async function request(params) {
    if (!API_URL) throw new Error('Dashboard se Udhari tab open karein');
    const qs = new URLSearchParams({...params,t:Date.now()});
    const response = await fetch(API_URL+'?'+qs.toString(),{cache:'no-store'});
    if (!response.ok) throw new Error('HTTP '+response.status);
    return response.json();
  }

  async function loadData(force=false) {
    let showingCache=false;
    if(!force) {
      try {
        const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
        if(Array.isArray(cached?.records)) {
          records=cached.records;
          customersMaster=Array.isArray(cached.customersMaster)?cached.customersMaster:[];
          render();
          showingCache=true;
          setStatus('Ready · Cached JSON');
        }
      } catch(e){}
    }
    if(!showingCache)setStatus(force?'Syncing...':'Ready');
    try {
      const result=await request({action:'getUdhariData'});
      if(!result.success) throw new Error(result.error||'Load failed');
      records=result.data||[];
      customersMaster=Array.isArray(result.customers)?result.customers:[];
      cache();
      render();
      setStatus(showingCache?'Background sync complete':'Updated');
    } catch(error) {
      if(showingCache)setStatus('Cached data · Background sync pending',true);
      else setStatus(error.message,true);
    }
  }

  const normalizeMobile = value => String(value||'').replace(/\D/g,'').replace(/^91(?=\d{10}$)/,'');

  function getCustomers() {
    const grouped={};
    customersMaster.forEach(customer=>{
      const mobile=normalizeMobile(customer.mobileNo);
      if(!mobile)return;
      const latest=Array(24).fill('');
      latest[COL.name]=customer.customerName;latest[COL.mobile]=mobile;latest[COL.address]=customer.address;
      latest[COL.balance]=0;latest[COL.interest]=0;latest[COL.total]=0;latest[COL.status]='PAID';
      latest[COL.createdBy]=customer.createdBy||'';latest[COL.timestamp]=customer.createdAt||'';
      grouped[mobile]={key:mobile,mobile,name:customer.customerName,address:customer.address,entries:[],latest};
    });
    records.slice().sort((a,b)=>dateTime(a[COL.date])-dateTime(b[COL.date])).forEach(r=>{
      const mobile=normalizeMobile(r[COL.mobile]);
      const key=mobile||`missing-${r[COL.id]}`;
      if(!grouped[key]) grouped[key]={key,mobile,name:r[COL.name],address:r[COL.address],entries:[]};
      grouped[key].entries.push(r);
      grouped[key].name=r[COL.name]||grouped[key].name;
      grouped[key].address=r[COL.address]||grouped[key].address;
      grouped[key].latest=r;
    });
    return Object.values(grouped).sort((a,b)=>dateTime(b.latest[COL.date])-dateTime(a.latest[COL.date]));
  }

  function render() {
    const q=query.trim().toLowerCase();
    const customers=getCustomers();
    const filtered=q?customers.filter(c=>
      `${c.name} ${c.mobile} ${c.address}`.toLowerCase().includes(q) ||
      c.entries.some(r=>r.some(v=>String(v||'').toLowerCase().includes(q)))
    ):customers;
    filteredCount=filtered.length;
    const shown=filtered.slice(0,visible);
    document.getElementById('customerCards').innerHTML=shown.length?shown.map(c=>{
      const r=c.latest;
      const balance=num(r[COL.balance]);
      const balanceClass=balance===0?'zero-balance':String(r[COL.status]).toUpperCase()==='OVERDUE'?'overdue-balance':'normal-balance';
      const totalUdhari=c.entries.reduce((s,x)=>s+num(x[COL.udhar]),0);
      const totalPayment=c.entries.reduce((s,x)=>s+num(x[COL.payment]),0);
      return `<article class="customer-card">
        <div class="customer-head">
          <div><h3 class="customer-name">${escapeHtml(c.name||'Unnamed Customer')}</h3><div class="customer-mobile"><i class="fas fa-phone"></i> ${escapeHtml(c.mobile||r[COL.mobile])}</div></div>
          <div class="customer-balance ${balanceClass}">${money(balance)}</div>
        </div>
        <div class="customer-info">
          <div><span>Total Udhari</span><b>${money(totalUdhari)}</b></div>
          <div><span>Payment Mila</span><b>${money(totalPayment)}</b></div>
          <div><span>Remaining Interest</span><b>${money(r[COL.interest])}</b></div>
          <div><span>Total Payable</span><b>${money(r[COL.total])}</b></div>
          <div><span>Last Entry</span><b>${escapeHtml(r[COL.date])}</b></div>
          <div><span>Created By</span><b>${escapeHtml(r[COL.createdBy]||'-')}</b><small style="display:block;color:#718096;font-size:9px;">${escapeHtml(r[COL.timestamp]||'-')}</small></div>
        </div>
        <div class="customer-actions">
          <button class="icon-only add-credit" data-right="create" onclick="addCustomerUdhari('${escapeHtml(c.key)}')" title="Add Udhari" aria-label="Add Udhari"><i class="fas fa-hand-holding-dollar"></i></button>
          <button class="icon-only add-payment" data-right="create" onclick="addCustomerPayment('${escapeHtml(c.key)}')" title="Add Payment" aria-label="Add Payment"><i class="fas fa-indian-rupee-sign"></i></button>
          <button class="icon-only open-ledger" onclick="openLedger('${escapeHtml(c.key)}')" title="Full Ledger" aria-label="Full Ledger"><i class="fas fa-book-open"></i></button>
          <button class="icon-only due-reminder" onclick="shareWhatsApp('${escapeHtml(c.key)}')" title="WhatsApp Due Reminder" aria-label="WhatsApp Due Reminder"><i class="fab fa-whatsapp"></i></button>
        </div>
      </article>`;
    }).join(''):'<div class="empty-state"><i class="fas fa-user-slash"></i><br><br>No customer found</div>';
    document.getElementById('recordCount').textContent=`${shown.length} / ${filtered.length} customers`;
    const more=document.getElementById('moreWrap'); more.style.display=filtered.length>10?'flex':'none';
    document.getElementById('moreButton').textContent=shown.length>=filtered.length?'Show Less':'Show 10 More';
    renderStats(customers);
  }

  function renderStats(customers=getCustomers()) {
    const current=customers.map(c=>c.latest);
    document.getElementById('customerCount').textContent=customers.length;
    document.getElementById('totalUdhari').textContent=money(records.reduce((s,r)=>s+num(r[COL.udhar]),0));
    document.getElementById('totalPayment').textContent=money(records.reduce((s,r)=>s+num(r[COL.payment]),0));
    document.getElementById('totalBalance').textContent=money(current.reduce((s,r)=>s+num(r[COL.balance]),0));
    document.getElementById('totalInterest').textContent=money(current.reduce((s,r)=>s+num(r[COL.interest]),0));
    document.getElementById('totalPayable').textContent=money(current.reduce((s,r)=>s+num(r[COL.total]),0));
  }

  function handleSearch(value) { query=value;visible=10;document.getElementById('clearSearch').style.display=value?'block':'none';render(); }
  function clearSearch() { const el=document.getElementById('searchInput');el.value='';query='';visible=10;document.getElementById('clearSearch').style.display='none';render();el.focus(); }
  function toggleMore() { visible=visible>=filteredCount?10:visible+10;render(); }
  function applyType(updateDescription=true) {
    const type=document.getElementById('transactionType').value;
    const description=document.getElementById('description');
    const rate=document.getElementById('interestRate');
    const interestType=document.getElementById('interestType');
    const interestStart=document.getElementById('interestStartDate');
    const isPayment=type==='PAYMENT MILA';
    document.querySelectorAll('.credit-only').forEach(field=>field.hidden=isPayment);
    document.querySelectorAll('.payment-only').forEach(field=>field.hidden=!isPayment);
    document.getElementById('udharAmountLabel').textContent=type==='UDHAR LIYA'?'Udhari Liya Amount':'Udhari Diya Amount';
    rate.disabled=isPayment;
    interestType.disabled=isPayment;
    interestStart.disabled=isPayment;
    if(type==='PAYMENT MILA') {
      document.getElementById('udharAmount').value='';
      document.getElementById('dueDate').value='';
      document.getElementById('reminderDate').value='';
      rate.value='0';
      interestStart.value='';
      if(updateDescription) {
        description.value='Customer se payment mila';
        const customer=findCustomer(document.getElementById('mobileNo').value);
        if(customer)document.getElementById('paymentAmount').value=Math.max(0,num(customer.latest[COL.total])).toFixed(2);
      }
    } else if(type==='UDHAR LIYA') {
      document.getElementById('paymentAmount').value='';
      document.getElementById('paymentMode').value='';
      document.getElementById('referenceNo').value='';
      if(!interestStart.value)interestStart.value=document.getElementById('date').value;
      if(updateDescription)description.value='Customer ne udhar liya';
    } else {
      document.getElementById('paymentAmount').value='';
      document.getElementById('paymentMode').value='';
      document.getElementById('referenceNo').value='';
      if(!interestStart.value)interestStart.value=document.getElementById('date').value;
      if(updateDescription)description.value='Customer ko udhar diya';
    }
  }
  function syncInterestDate() {
    if(document.getElementById('transactionType').value!=='PAYMENT MILA') {
      document.getElementById('interestStartDate').value=document.getElementById('date').value;
    }
  }

  function findCustomer(keyOrMobile) {
    const wanted=normalizeMobile(keyOrMobile);
    return getCustomers().find(c=>c.key===keyOrMobile||(wanted&&c.mobile===wanted));
  }

  function lookupCustomer() {
    const mobile=normalizeMobile(document.getElementById('mobileNo').value);
    const customer=findCustomer(mobile);
    const note=document.getElementById('customerLookup');
    if(customer) {
      document.getElementById('customerName').value=customer.name||'';
      document.getElementById('address').value=customer.address||'';
      note.textContent=`Existing customer मिला: ${customer.name} · Balance ${money(customer.latest[COL.balance])}`;
      note.style.color='#008f68';
    } else {
      note.textContent=mobile.length>=10?'New customer mobile number':'';
      note.style.color='#b45309';
    }
  }

  function openNewCustomerForm() {
    if(!requireRight('create'))return;
    document.getElementById('customerForm').reset();
    document.getElementById('customerModal').classList.add('open');
    document.getElementById('newCustomerMobile').focus();
  }
  function closeCustomerForm(){document.getElementById('customerModal').classList.remove('open');}
  async function saveNewCustomer(event){
    event.preventDefault();
    if(!requireRight('create'))return;
    const data={mobileNo:normalizeMobile(document.getElementById('newCustomerMobile').value),customerName:document.getElementById('newCustomerName').value.trim(),address:document.getElementById('newCustomerAddress').value.trim()};
    if(data.mobileNo.length!==10)return alert('Sahi 10-digit mobile number enter karein');
    if(findCustomer(data.mobileNo))return alert('Is mobile number ka customer pehle se bana hua hai');
    const button=document.getElementById('customerSaveButton');button.disabled=true;setStatus('Customer saving...');
    try{const result=await request({action:'saveUdhariCustomer',data:JSON.stringify(data)});if(!result.success)throw new Error(result.error||'Customer save failed');applyServerData(result,'Customer added');closeCustomerForm();}
    catch(error){setStatus(error.message,true);alert(error.message||'Customer save failed');}finally{button.disabled=false;}
  }

  function addCustomerPayment(key) {
    if(!requireRight('create'))return;
    const customer=findCustomer(key);
    if(!customer)return;
    returnToLedgerKey=document.getElementById('ledgerModal').classList.contains('open')?customer.key:'';
    openForm();
    const latest=customer.latest;
    document.getElementById('customerName').value=customer.name||'';
    document.getElementById('mobileNo').value=customer.mobile||latest[COL.mobile];
    document.getElementById('address').value=customer.address||'';
    document.getElementById('transactionType').value='PAYMENT MILA';
    applyType();
    document.getElementById('paymentAmount').value=Math.max(0,num(latest[COL.total])).toFixed(2);
    document.getElementById('description').value='Part / full payment received';
    document.getElementById('formTitle').textContent=`Payment - ${customer.name}`;
    lookupCustomer();
    document.getElementById('paymentAmount').focus();
  }

  function addCustomerUdhari(key) {
    if(!requireRight('create'))return;
    const customer=findCustomer(key);
    if(!customer)return;
    returnToLedgerKey=document.getElementById('ledgerModal').classList.contains('open')?customer.key:'';
    openForm();
    const latest=customer.latest;
    document.getElementById('customerName').value=customer.name||'';
    document.getElementById('mobileNo').value=customer.mobile||latest[COL.mobile];
    document.getElementById('address').value=customer.address||'';
    document.getElementById('transactionType').value='UDHAR DIYA';
    document.getElementById('udharAmount').value='';
    document.getElementById('paymentAmount').value='';
    document.getElementById('description').value='Additional Udhari';
    document.getElementById('interestRate').value=latest[COL.rate]||0;
    document.getElementById('interestType').value=latest[COL.interestType]||'MONTHLY';
    document.getElementById('interestStartDate').value=document.getElementById('date').value;
    document.getElementById('formTitle').textContent=`Add Udhari - ${customer.name}`;
    lookupCustomer();
    document.getElementById('udharAmount').focus();
  }

  function shareWhatsApp(key) {
    const customer=findCustomer(key);
    if(!customer)return;
    const latest=customer.latest;
    const mobile=normalizeMobile(customer.mobile||latest[COL.mobile]);
    if(mobile.length!==10)return alert('Customer ka sahi 10-digit mobile number nahi mila');
    const dueEntry=[...customer.entries].reverse().find(r=>r[COL.due]);
    const dueDate=dueEntry?.[COL.due]||'Date available nahi hai';
    const message=[
      `Namaste ${customer.name||'Customer'},`,
      '',
      'Yeh aapke udhari payment ka reminder hai.',
      `Baki amount: ${money(latest[COL.balance])}`,
      `Total payable: ${money(latest[COL.total])}`,
      `Due Date: ${dueDate}`,
      '',
      'Kripya payment karke confirmation share karein. Dhanyavaad.'
    ].join('\n');
    window.open(`https://wa.me/91${mobile}?text=${encodeURIComponent(message)}`,'_blank','noopener');
  }

  function exportCustomerLedger(key) {
    const customer=findCustomer(key);
    if(!customer)return;
    const rows=[...customer.entries].sort((a,b)=>dateTime(a[COL.date])-dateTime(b[COL.date])).map(r=>({
      'Mobile No':customer.mobile||r[COL.mobile], 'Customer Name':r[COL.name], 'Date':r[COL.date],
      'Transaction Type':r[COL.type], 'Description':r[COL.description], 'Udhari Amount':num(r[COL.udhar]),
      'Payment Amount':num(r[COL.payment]), 'Running Balance':num(r[COL.balance]), 'Interest':num(r[COL.interest]),
      'Total Payable':num(r[COL.total]), 'Due Date':r[COL.due], 'Status':r[COL.status],
      'Payment Mode':r[COL.mode], 'UTR / Reference':r[COL.ref], 'Reminder Date':r[COL.reminder],
      'Remarks':r[COL.remarks], 'Created By':r[COL.createdBy], 'Saved At':r[COL.timestamp]
    }));
    const XLSX=window.parent?.XLSX||window.XLSX;
    if(!XLSX)return alert('Excel library load nahi hui. Page refresh karke dobara try karein.');
    const sheet=XLSX.utils.json_to_sheet(rows);
    sheet['!cols']=[14,24,12,18,28,15,15,16,14,16,12,12,16,19,14,28,22,18].map(w=>({wch:w}));
    const book=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(book,sheet,'Customer Ledger');
    const safeName=String(customer.name||'Customer').replace(/[\\/:*?"<>|]/g,' ').trim();
    XLSX.writeFile(book,`${safeName}-${customer.mobile||'mobile'}-Udhari-Ledger.xlsx`);
  }

  function openLedger(key) {
    const customer=findCustomer(key);
    if(!customer)return;
    activeLedgerKey=customer.key;
    const entries=[...customer.entries].sort((a,b)=>dateTime(b[COL.date])-dateTime(a[COL.date]));
    const latest=customer.latest;
    const totalUdhari=entries.reduce((s,r)=>s+num(r[COL.udhar]),0);
    const totalPayment=entries.reduce((s,r)=>s+num(r[COL.payment]),0);
    document.getElementById('ledgerTitle').textContent=`${customer.name} · ${customer.mobile||latest[COL.mobile]} Ledger`;
    document.getElementById('ledgerSummary').innerHTML=`
      <div class="ledger-kpis">
        <div class="card"><span>Total Udhari</span><strong>${money(totalUdhari)}</strong></div>
        <div class="card"><span>Payment Mila</span><strong>${money(totalPayment)}</strong></div>
        <div class="card"><span>Balance</span><strong>${money(latest[COL.balance])}</strong></div>
        <div class="card"><span>Remaining Interest</span><strong>${money(latest[COL.interest])}</strong></div>
        <div class="card"><span>Total Payable</span><strong>${money(latest[COL.total])}</strong></div>
      </div>
      <div class="ledger-command-row">
        <button class="primary" data-right="create" onclick="addCustomerUdhari('${escapeHtml(customer.key)}')"><i class="fas fa-plus"></i> Add Udhari</button>
        <button class="success" data-right="create" onclick="addCustomerPayment('${escapeHtml(customer.key)}')"><i class="fas fa-indian-rupee-sign"></i> Add Payment</button>
        <button class="excel" onclick="exportCustomerLedger('${escapeHtml(customer.key)}')"><i class="fas fa-file-excel"></i> Excel</button>
        <button class="whatsapp" onclick="shareWhatsApp('${escapeHtml(customer.key)}')"><i class="fab fa-whatsapp"></i> Due Reminder</button>
      </div>`;
    document.getElementById('ledgerRows').innerHTML=entries.length?entries.map(r=>`<tr>
      <td data-label="Date">${escapeHtml(r[COL.date])}</td><td data-label="Type">${escapeHtml(r[COL.type])}</td><td data-label="Description">${escapeHtml(r[COL.description])}</td>
      <td data-label="Udhari">${money(r[COL.udhar])}</td><td data-label="Payment">${money(r[COL.payment])}</td><td data-label="Balance"><b>${money(r[COL.balance])}</b></td>
      <td data-label="Interest">${money(r[COL.interest])}</td><td data-label="Total Payable"><b>${money(r[COL.total])}</b></td><td data-label="Due Date">${escapeHtml(r[COL.due])}</td>
      <td data-label="Status"><span class="badge ${String(r[COL.status]).toLowerCase()}">${escapeHtml(r[COL.status])}</span></td>
      <td data-label="Mode">${escapeHtml(r[COL.mode])}</td><td data-label="Reference">${escapeHtml(r[COL.ref])}</td><td data-label="Remarks">${escapeHtml(r[COL.remarks])}</td>
      <td data-label="Actions"><div class="actions"><button class="outline" data-right="edit" onclick="closeLedger();editEntry('${escapeHtml(r[COL.id])}')"><i class="fas fa-pen"></i></button><button class="danger" data-right="delete" onclick="deleteEntry('${escapeHtml(r[COL.id])}')"><i class="fas fa-trash"></i></button></div></td>
    </tr>`).join(''):'<tr><td colspan="14" style="text-align:center!important;padding:14px!important;">No transaction entries</td></tr>';
    const ledgerModal=document.getElementById('ledgerModal');
    ledgerModal.hidden=false;
    ledgerModal.classList.add('open');
  }
  function closeLedger(){
    const modal=document.getElementById('ledgerModal');
    modal.classList.remove('open');
    modal.hidden=true;
    activeLedgerKey='';
    returnToLedgerKey='';
  }

  function openForm(record=null) {
    if(!requireRight(record?'edit':'create'))return;
    document.getElementById('entryForm').reset();
    document.getElementById('entryId').value='';
    document.getElementById('date').value=localTodayIso();
    document.getElementById('interestStartDate').value=document.getElementById('date').value;
    document.getElementById('interestRate').value='0';
    document.getElementById('customerLookup').textContent='';
    applyType();
    document.getElementById('formTitle').textContent=record?'Edit Udhari Entry':'Add Udhari Entry';
    if(record) {
      document.getElementById('entryId').value=record[COL.id]; document.getElementById('date').value=displayToIso(record[COL.date]);
      document.getElementById('customerName').value=record[COL.name]; document.getElementById('mobileNo').value=record[COL.mobile];
      document.getElementById('address').value=record[COL.address]; document.getElementById('transactionType').value=record[COL.type];
      document.getElementById('description').value=record[COL.description]; document.getElementById('udharAmount').value=record[COL.udhar];
      document.getElementById('paymentAmount').value=record[COL.payment]; document.getElementById('dueDate').value=displayToIso(record[COL.due]);
      document.getElementById('paymentMode').value=record[COL.mode]; document.getElementById('referenceNo').value=record[COL.ref];
      document.getElementById('reminderDate').value=displayToIso(record[COL.reminder]); document.getElementById('remarks').value=record[COL.remarks];
      document.getElementById('interestRate').value=record[COL.rate]; document.getElementById('interestType').value=record[COL.interestType]||'MONTHLY';
      document.getElementById('interestStartDate').value=displayToIso(record[COL.interestStart]);
      applyType(false);
    }
    document.getElementById('entryModal').classList.add('open');
  }
  function closeForm(){document.getElementById('entryModal').classList.remove('open');}
  function editEntry(id){if(!requireRight('edit'))return;const r=records.find(x=>String(x[COL.id])===String(id));if(r)openForm(r);}

  async function saveEntry(event) {
    event.preventDefault();
    const editing=Boolean(document.getElementById('entryId').value);
    if(!requireRight(editing?'edit':'create'))return;
    const selectedType=document.getElementById('transactionType').value;
    if(selectedType!=='PAYMENT MILA'&&!document.getElementById('interestStartDate').value) {
      document.getElementById('interestStartDate').value=document.getElementById('date').value;
    }
    const data={entryId:document.getElementById('entryId').value,date:isoToDisplay(document.getElementById('date').value),customerName:document.getElementById('customerName').value.trim(),mobileNo:normalizeMobile(document.getElementById('mobileNo').value),address:document.getElementById('address').value.trim(),transactionType:document.getElementById('transactionType').value,description:document.getElementById('description').value.trim(),udharAmount:num(document.getElementById('udharAmount').value),paymentAmount:num(document.getElementById('paymentAmount').value),dueDate:isoToDisplay(document.getElementById('dueDate').value),paymentMode:document.getElementById('paymentMode').value,referenceNo:document.getElementById('referenceNo').value.trim(),reminderDate:isoToDisplay(document.getElementById('reminderDate').value),remarks:document.getElementById('remarks').value.trim(),interestRate:num(document.getElementById('interestRate').value),interestType:document.getElementById('interestType').value,interestStartDate:isoToDisplay(document.getElementById('interestStartDate').value),createdBy:window.parent.currentKrpUser?.email||''};
    if(data.mobileNo.length<10)return alert('Sahi mobile number enter karein');
    if(!findCustomer(data.mobileNo))return alert('Pehle New Customer button se customer ki basic details add karein');
    if(data.transactionType!=='PAYMENT MILA'&&data.udharAmount<=0)return alert('Udhari amount enter karein');
    if(data.transactionType==='PAYMENT MILA'&&data.paymentAmount<=0)return alert('Payment amount enter karein');
    const button=document.getElementById('saveButton');button.disabled=true;setStatus('Saving...');
    try {
      const action=data.entryId?'updateUdhariRecord':'saveUdhariRecord';
      const ledgerKey=returnToLedgerKey||activeLedgerKey;
      closeForm();
      closeLedger();
      const result=await request({action,data:JSON.stringify(data)});
      if(!result.success)throw new Error(result.error||'Save failed');
      if(!applyServerData(result,data.entryId?'Entry updated':'Entry saved')) await loadData(true);
      if(ledgerKey) openLedger(ledgerKey);
      returnToLedgerKey='';
    }
    catch(error){setStatus(error.message,true);} finally{button.disabled=false;}
  }

  async function deleteEntry(id) {
    if(!requireRight('delete'))return;
    if(!confirm('Is Udhari entry ko delete karein?'))return;
    const previousRecords=records;
    closeLedger();
    records=records.filter(r=>String(r[COL.id])!==String(id));
    cache();
    render();
    setStatus('Deleting...');
    try {
      const result=await request({action:'deleteUdhariRecord',entryId:id});
      if(!result.success)throw new Error(result.error||'Delete failed');
      if(!applyServerData(result,'Entry deleted')) await loadData(true);
    }
    catch(error){
      records=previousRecords;
      cache();
      render();
      setStatus(error.message,true);
    }
  }

  document.getElementById('entryModal').addEventListener('click',e=>{if(e.target.id==='entryModal')closeForm();});
  document.getElementById('customerModal').addEventListener('click',e=>{if(e.target.id==='customerModal')closeCustomerForm();});
  document.getElementById('ledgerModal').addEventListener('click',e=>{if(e.target.id==='ledgerModal')closeLedger();});
  window.addEventListener('load',()=>{
    applyPermissionVisibility();
    setTimeout(applyPermissionVisibility,500);
    loadData(false);
    setInterval(()=>loadData(false),120000);
  });
</script>
</body>
</html>
